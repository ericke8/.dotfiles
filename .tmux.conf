# Advertise 256-color support to programs inside tmux
set -g default-terminal "xterm-256color"
# Allow true color (24-bit RGB) passthrough from outer terminal
set -ga terminal-overrides ",*256color*:Tc"

# Mouse support (scroll, click panes, resize)
set -g mouse on

# Show session/window name in terminal title bar
set -g set-titles on

# Suppress bell notifications
set -g visual-bell off

# Scrollback buffer (default 2000)
set -g history-limit 50000